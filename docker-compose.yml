# 足球AI助手 - Docker Compose 一键启动
# 用法：docker compose up -d
# 访问：http://localhost:8080

services:
  backend:
    image: football-ai-backend:latest
    container_name: football-backend
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - backend_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - football-net

  frontend:
    image: football-ai-frontend:latest
    container_name: football-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - football-net

volumes:
  backend_data:
    name: football-backend-data

networks:
  football-net:
    driver: bridge
